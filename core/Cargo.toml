[package]
name = "agenceland-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The agent core of Agenceland: sessions, worktrees, permissions, file tools and the session record, behind JSON-RPC on standard input and output"
repository = "https://github.com/Progmasoft/agenceland"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
